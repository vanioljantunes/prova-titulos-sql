[project]
name = "provas"
version = "0.1.0"
description = "Pipeline reprodutível: PDFs de provas de título e editais → banco relacional com rastreabilidade completa"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "duckdb-engine>=0.15",
    "alembic>=1.14",
    "pydantic>=2.9",
    "typer>=0.15",
    "docling>=2.126.0",
]

[project.scripts]
provas = "provas.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# DDL autogerado congelado; linhas longas são aceitáveis
"migrations/versions/*" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["provas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
